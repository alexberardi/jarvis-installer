name: Deploy to GitHub Pages

# public/ is the whole site: plain HTML, CSS and images, no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the site
        run: python3 scripts/check-site.py
      - name: Add the analytics beacon (only when a token is configured)
        env:
          # Public Cloudflare Web Analytics token (a repo Variable, or a Secret as a
          # fallback). Unset = no beacon, so forks and previews ship no tracking.
          CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN || secrets.VITE_CF_BEACON_TOKEN }}
        run: |
          token="$(printf '%s' "$CF_BEACON_TOKEN" | tr -cd 'A-Za-z0-9')"
          if [ -n "$token" ]; then
            tag="<script defer src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"$token\"}'></script>"
            sed -i "s|<!-- cf-beacon -->|$tag|" public/index.html
            grep -q 'data-cf-beacon' public/index.html
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
