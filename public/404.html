<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Installer</title>
    <script>
      // SPA routing for GitHub Pages: served at root of custom domain.
      // Bounce 404s to / with the original path stashed in ?redirect=.
      var route = window.location.pathname || '/';
      window.location.replace(
        window.location.origin + '/?redirect=' + encodeURIComponent(route + window.location.search + window.location.hash)
      );
    </script>
  </head>
  <body></body>
</html>
