<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Installer</title>
    <script>
      // SPA routing for GitHub Pages
      // Redirects 404 requests to index.html with the path as a query param
      var path = window.location.pathname;
      window.location.replace(
        window.location.origin + '/?redirect=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
