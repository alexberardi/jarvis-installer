<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Installer</title>
    <script>
      // SPA routing for GitHub Pages
      // Redirects 404 requests to index.html with the path as a query param
      var path = window.location.pathname;
      var base = '/jarvis-installer';
      // Strip base path so the redirect param is just the route (e.g., /configurator)
      var route = path;
      if (path.startsWith(base)) {
        route = path.slice(base.length) || '/';
      }
      window.location.replace(
        window.location.origin + base + '/?redirect=' + encodeURIComponent(route + window.location.search + window.location.hash)
      );
    </script>
  </head>
  <body></body>
</html>
